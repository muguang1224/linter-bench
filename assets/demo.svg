<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="linter-bench example output">
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="18" fill="url(#term)" stroke="#1e293b"/>
  <rect x="0" y="0" width="1200" height="44" rx="18" fill="#111c30"/>
  <rect x="0" y="26" width="1200" height="18" fill="#111c30"/>
  <circle cx="26" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="22" r="6" fill="#22c55e"/>
  <text x="96" y="27" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">linter-bench — controls, not a leaderboard</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="36" y="86" fill="#e2e8f0">linter-bench 0.1.0 -- corpus: corpus (20 cases: 13 defect, 7 clean)</text>

    <text y="138" fill="#64748b" font-size="14"><tspan x="36">TOOL</tspan><tspan x="220">CASES</tspan><tspan x="310">TP</tspan><tspan x="370">FP</tspan><tspan x="430">FN</tspan><tspan x="500">PRECISION</tspan><tspan x="650">RECALL</tspan><tspan x="790">F1</tspan><tspan x="880">CRASH</tspan></text>
    <text y="172" fill="#cbd5e1"><tspan x="36">reference</tspan><tspan x="220">20</tspan><tspan x="310">14</tspan><tspan x="370">0</tspan><tspan x="430">0</tspan><tspan x="500" fill="#34d399">100.0%</tspan><tspan x="650" fill="#34d399">100.0%</tspan><tspan x="790" fill="#34d399">100.0%</tspan><tspan x="880">0</tspan></text>
    <text y="206" fill="#cbd5e1"><tspan x="36">naive</tspan><tspan x="220">8</tspan><tspan x="310">4</tspan><tspan x="370">3</tspan><tspan x="430">3</tspan><tspan x="500" fill="#f59e0b">57.1%</tspan><tspan x="650" fill="#f59e0b">57.1%</tspan><tspan x="790" fill="#f59e0b">57.1%</tspan><tspan x="880">0</tspan></text>

    <text x="36" y="262" fill="#38bdf8" font-size="14" letter-spacing="2">WHY THE NEGATIVE CONTROL LOSES</text>
    <text x="36" y="292" fill="#94a3b8">naive reports every line containing "assert"</text>
    <text x="36" y="318" fill="#94a3b8">4 true labels · 3 false positives · 3 missed labels</text>

    <text x="36" y="374" fill="#38bdf8" font-size="14" letter-spacing="2">SCOPE</text>
    <text x="36" y="404" fill="#94a3b8">reference: all categories · rule mapping, exact</text>
    <text x="36" y="430" fill="#94a3b8">naive: test-quality only · location match, ±1 line</text>

    <text x="36" y="480" fill="#475569" font-size="13">Every label is in the repository. Every false positive is counted.</text>
  </g>
</svg>
