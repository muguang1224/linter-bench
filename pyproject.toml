[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linter-bench"
version = "0.1.0"
description = "A small, labeled benchmark for static checkers: precision, recall, F1, crashes."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "muguang1224" }]
keywords = ["static-analysis", "linter", "benchmark", "precision", "recall", "zero-dependencies"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/muguang1224/linter-bench"

[project.scripts]
linter-bench = "linter_bench:main"

[tool.setuptools]
py-modules = ["linter_bench", "reference_detector", "naive_detector"]
